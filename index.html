<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cluenteering</title>
    <link rel="icon" type="image/x-icon" href="Assetas/Cluenteering.png">
    <style>
        .releasecheck {
            position: absolute;
        }
        body{ background-image: url(Assetas/Bg\ shit.jpeg);
              background-repeat: no-repeat;
              background-size: cover;
              background-position: center;
              background-position-y: top;

        }
        img{
            padding-top: 10%;
            padding-left: 1%;
            padding-right: 1%;
        }
       
        .popup-box {
            z-index: 1000;
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px;
            background: rgb(255, 221, 0);
            border: 10px solid rgb(210, 119, 0);
            border-radius: 25px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
            animation-name: popupEnter;
            animation-duration: 0.4s;
            animation-timing-function: ease-out;
        }
         .btngetstarted {
        padding: 12px 24px; 
        font-size: 16px;
        min-width: 120px;
        min-height: 44px;
        background-color: #1f0471; 
        color: rgb(255, 255, 255); 
        cursor: pointer;
        border-radius: 25px;
        height: 75px;
        width: 200px;
        font-size: 20px;
        font-weight: bold;
        font-family: helvetica;
        transition-duration: 0.2s;
        box-shadow: 0px 0px 5px rgba(0,0,0,0.5);
        }
        .btngetstarted:hover {
            background-color: #0d0246;
            text-shadow: 0px 0px 10px rgba(255, 255, 255, 0.5);
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
        }
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
            animation-name: shadowIn;
            animation-duration: 0.4s;
            animation-timing-function: ease-out;
        }
        .btnclosepopup {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #1f0471;
            color: rgb(255, 255, 255);
            border: none;
            border-radius: 20%;
            width: 30px;
            height: 30px;
            font-size: 16px;
            margin-bottom: 5px;
            transition-duration: 0.2s;
            box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.5);
        }
        .btnclosepopup:hover {
            background-color: #0d0246;
            text-shadow: 0px 0px 10px rgba(255, 255, 255, 0.5);
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.5);
        }
        @keyframes popupEnter {
            0% {
                transform: translate(-50%, -40%) scale(1);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }
        @keyframes shadowIn {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }
        @keyframes popupClose {
            0% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -40%) scale(1);
                opacity: 0;
            }
        }
        @keyframes shadowOut {
            0% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }
        .pin {
            width: 140px;
            height: 20px;
            padding: 10px;
            letter-spacing: 10px;
            font-size: 18px;
            color: rgb(255, 255, 255);
            text-align: center;
            background-color: #1f0471;
            border: 2px solid #1f0471;
            border-radius: 10px;
            outline: none;
            padding-left: 20px;
            transition-duration: 0.2s;
            box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.5);
        }
        .pin:hover {
            background-color: #0d0246;
            border: 2px solid #0d0246;
            text-shadow: 0px 0px 10px rgba(255, 255, 255, 0.5);
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    
    <div id="editorEntrance" class="popup-box">
        <h2 align="center" style="font-family: Arial, Helvetica, sans-serif;">EDITOR</h2> <button class="btnclosepopup" onclick="closePopup()">✖</button> 
        <p align="center" style="font-size: 16px; font-family: Helvetica;">Enter Acquired Pin:</p>
        <center><input id="pinInput" class="pin" type="password" maxlength="4"placeholder="●●●●" oninput="checkPin()"></center> <br>
        <p align="center" style="font-size: 16px; font-family: Helvetica; color: red; display: none;" id="wrongPinMessage">Incorrect Pin.</p>

    </div>
    <script>
        function openPopup() {
            const popup = document.getElementById("editorEntrance");
            const overlay = document.getElementById("overlay");
            popup.style.display = "block";
            overlay.style.display = "block";
            popup.style.animationName = "popupEnter";
            overlay.style.animationName = "shadowIn";
            document.getElementById("pinInput").focus();
        }
        function closePopup() {
            const popup = document.getElementById("editorEntrance");
            const overlay = document.getElementById("overlay");
            popup.style.animationName = "popupClose";
            overlay.style.animationName = "shadowOut";
            
            setTimeout(() => {
                popup.style.display = "none";
                overlay.style.display = "none";
                document.getElementById("wrongPinMessage").style.display = "none";
                document.getElementById("pinInput").value = "";
            }, 400);
        }
        function checkPin() {
            const correctpinhash = "1234";
            if (document.getElementById("pinInput").value.length === 4) {
                if (document.getElementById("pinInput").value == 1234) {
                    setTimeout(() => {
                        closePopup();
                        window.location.href = "editor.html";
                    }, 300);
                } else {
                    wrongPin();
                    document.getElementById("pinInput").value = "";
                }
            } else {
                document.getElementById("wrongPinMessage").style.display = "none";
            }
            
        }
        function wrongPin() {
            document.getElementById("wrongPinMessage").style.display = "block";
        }
    </script>
    <center>
        <img src="Assetas/Cluenteering.png" alt="yo get a better internet" width="10%">
        <img src="Assetas/Cluenteering text.png" alt="yo get a better internet (Slowed + ReverB)" width="40%">
    </center>

    <center><button class="btngetstarted" onclick="openPopup()">GET STARTED</button></center>
    <pre>






    </pre>
    <div id="overlay" class="overlay" onclick="closePopup()"></div>
    <p id="releasecheck">Cluenteering Beta Release Version 1.1.0</p>
    <p id="releasecheck">Made and Distributed by Trip Games Unofficial</p>
</body>
</html>
